<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>數位社會處方｜長青友善極簡運動平台</title>
  <style>
    /* =========================================
       1. 無障礙極簡設計系統 (Accessible Minimalist UI)
       高對比配色、特大字體、零視覺雜訊
       ========================================= */
    :root {
      --bg-page: #F1F5F9;
      --bg-card: #FFFFFF;
      --text-main: #0F172A;
      --text-sub: #334155;
      --primary: #1D4ED8;
      --primary-dark: #1E3A8A;
      --success: #15803D;
      --success-dark: #14532D;
      --accent: #B45309;
      --border: #CBD5E1;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-size: 20px;
      line-height: 1.6;
      padding-bottom: 48px;
    }

    header {
      background-color: var(--text-main);
      color: #FFFFFF;
      padding: 20px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 1.8rem;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .streak-banner {
      display: inline-block;
      background-color: #FEF3C7;
      color: #78350F;
      font-weight: 800;
      padding: 6px 18px;
      border-radius: 999px;
      font-size: 1.15rem;
      margin-top: 6px;
    }

    nav {
      display: flex;
      max-width: 760px;
      margin: 20px auto 0;
      padding: 0 16px;
      gap: 12px;
    }

    .nav-btn {
      flex: 1;
      padding: 18px 12px;
      font-size: 1.35rem;
      font-weight: 800;
      border: 3px solid var(--primary);
      border-radius: var(--radius);
      background-color: #FFFFFF;
      color: var(--primary);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .nav-btn.active {
      background-color: var(--primary);
      color: #FFFFFF;
    }

    main {
      max-width: 760px;
      margin: 20px auto;
      padding: 0 16px;
    }

    .section {
      display: none;
    }

    .section.active {
      display: block;
    }

    .card {
      background-color: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.05);
    }

    h2 {
      font-size: 1.6rem;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    /* 難度選擇大按鈕 */
    .mode-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 16px;
    }

    .mode-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding: 22px 24px;
      border: 3px solid var(--text-main);
      border-radius: var(--radius);
      background-color: #FFFFFF;
      color: var(--text-main);
      text-align: left;
      cursor: pointer;
    }

    .mode-btn:hover, .mode-btn:focus {
      background-color: #EFF6FF;
      border-color: var(--primary);
    }

    .mode-title {
      font-size: 1.45rem;
      font-weight: 800;
      display: block;
    }

    .mode-desc {
      font-size: 1.1rem;
      color: var(--text-sub);
    }

    .mode-badge {
      background-color: var(--primary);
      color: #FFFFFF;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 1.2rem;
      white-space: nowrap;
      margin-left: 12px;
    }

    .mode-badge.demo {
      background-color: var(--accent);
    }

    /* 運動進行中畫面 */
    .workout-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .step-indicator {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--primary);
      background: #DBEAFE;
      padding: 6px 14px;
      border-radius: 10px;
    }

    .timer-display {
      font-size: 3.5rem;
      font-weight: 900;
      text-align: center;
      color: var(--primary);
      font-variant-numeric: tabular-nums;
      margin: 8px 0;
    }

    .progress-track {
      width: 100%;
      height: 18px;
      background-color: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: var(--success);
      transition: width 0.4s linear;
    }

    .carousel-box {
      background-color: #F8FAFC;
      border: 3px solid var(--text-main);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
    }

    .pose-label {
      display: inline-block;
      font-size: 1.25rem;
      font-weight: 800;
      padding: 4px 16px;
      border-radius: 8px;
      background-color: var(--text-main);
      color: #FFFFFF;
      margin-bottom: 10px;
    }

    .svg-stage {
      width: 220px;
      height: 220px;
      margin: 0 auto;
    }

    .instruction-text {
      font-size: 1.35rem;
      font-weight: 700;
      text-align: center;
      color: var(--text-main);
      margin-bottom: 20px;
      background: #FEF9C3;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #FDE047;
    }

    .action-row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .btn-large {
      flex: 1;
      min-width: 160px;
      padding: 18px 20px;
      font-size: 1.3rem;
      font-weight: 800;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      color: #FFFFFF;
      text-align: center;
    }

    .btn-large:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-primary { background-color: var(--primary); }
    .btn-primary:hover { background-color: var(--primary-dark); }
    .btn-success { background-color: var(--success); }
    .btn-success:hover { background-color: var(--success-dark); }
    .btn-danger { background-color: #B91C1C; }
    .btn-outline {
      background-color: #FFFFFF;
      color: var(--text-main);
      border: 3px solid var(--text-main);
    }

    /* 選填稱呼輸入框 */
    .name-input-group {
      margin: 16px 0;
      background-color: #F8FAFC;
      padding: 14px 16px;
      border-radius: 12px;
      border: 2px solid var(--border);
    }

    .name-input-group label {
      display: block;
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .name-input-group input {
      width: 100%;
      padding: 12px 14px;
      font-size: 1.25rem;
      border: 2px solid var(--text-main);
      border-radius: 10px;
      background-color: #FFFFFF;
    }

    /* 成就徽章 Canvas */
    .canvas-wrapper {
      text-align: center;
      margin: 16px 0;
    }

    canvas#badgeCanvas {
      max-width: 100%;
      height: auto;
      border-radius: var(--radius);
      border: 3px solid var(--text-main);
    }

    /* 雲端連線狀態標籤 */
    .cloud-status {
      display: inline-block;
      font-size: 1rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 8px;
      background-color: #DCFCE7;
      color: #166534;
      margin-top: 8px;
    }

    .cloud-status.error {
      background-color: #FEE2E2;
      color: #991B1B;
    }

    /* 零打字社群動態牆 */
    .post-card {
      background-color: #FFFFFF;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 18px;
    }

    .post-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      border-bottom: 2px solid #F1F5F9;
      padding-bottom: 10px;
    }

    .post-author {
      font-size: 1.35rem;
      font-weight: 800;
    }

    .post-time {
      font-size: 1rem;
      color: var(--text-sub);
    }

    .post-badge-img {
      width: 100%;
      max-width: 460px;
      display: block;
      margin: 12px auto;
      border-radius: 12px;
      border: 2px solid var(--text-main);
    }

    .reaction-bar {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }

    .react-btn {
      flex: 1;
      padding: 14px 8px;
      font-size: 1.2rem;
      font-weight: 800;
      border: 2px solid var(--border);
      border-radius: 12px;
      background-color: #F8FAFC;
      color: var(--text-main);
      cursor: pointer;
    }

    .react-btn.reacted {
      background-color: #DBEAFE;
      border-color: var(--primary);
      color: var(--primary-dark);
    }

    .empty-wall {
      text-align: center;
      padding: 36px 20px;
      color: var(--text-sub);
      font-size: 1.25rem;
      font-weight: 700;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <h1>數位社會處方｜健康動一動</h1>
    <div class="streak-banner" id="headerStreak">🔥 目前連續運動：1 天</div>
  </header>

  <!-- 雙分頁極簡導覽 -->
  <nav>
    <button class="nav-btn active" id="tabExercise" onclick="switchTab('exercise')">1. 開始運動</button>
    <button class="nav-btn" id="tabSocial" onclick="switchTab('social')">2. 親友動態牆</button>
  </nav>

  <main>
    <!-- =========================================
         分頁一：運動引導與簽到模組
         ========================================= -->
    <section id="sectionExercise" class="section active">
      
      <!-- 步驟 A：選擇難度與時長 -->
      <div id="viewSelect" class="card">
        <h2>請選擇今天的運動難度</h2>
        <p style="color: var(--text-sub);">全程都有大圖示與語音帶領，不用擔心跟不上。</p>

        <div class="mode-list">
          <button class="mode-btn" onclick="startWorkout('easy')">
            <div>
              <span class="mode-title">簡單模式（坐姿伸展）</span>
              <span class="mode-desc">坐在椅子上即可完成，溫和活動肩頸與雙腿</span>
            </div>
            <span class="mode-badge">5 分鐘</span>
          </button>

          <button class="mode-btn" onclick="startWorkout('medium')">
            <div>
              <span class="mode-title">中等模式（站立平衡）</span>
              <span class="mode-desc">扶著椅背或原地踏步，訓練下肢肌力與穩定度</span>
            </div>
            <span class="mode-badge">10 分鐘</span>
          </button>

          <button class="mode-btn" onclick="startWorkout('demo')">
            <div>
              <span class="mode-title">展示體驗模式（快速測試）</span>
              <span class="mode-desc">課堂與競賽現場展示專用，15 秒體驗完整流程</span>
            </div>
            <span class="mode-badge demo">15 秒</span>
          </button>
        </div>
      </div>

      <!-- 步驟 B：運動引導進行中（動態圖解輪播 + 語音倒數） -->
      <div id="viewActive" class="card hidden">
        <div class="workout-header">
          <span class="step-indicator" id="stepCounter">動作 1 / 3</span>
          <button class="btn-outline" style="padding: 8px 14px; border-radius: 10px; font-weight: 700; cursor: pointer;" onclick="toggleAudio()">
            <span id="audioStatusText">🔊 語音開啟中</span>
          </button>
        </div>

        <h2 id="exerciseTitle" style="text-align: center; font-size: 1.8rem;">雙手向上伸展</h2>
        <div class="timer-display" id="timerText">00:30</div>

        <div class="progress-track">
          <div class="progress-fill" id="progressBar"></div>
        </div>

        <div class="carousel-box">
          <div class="pose-label" id="poseFrameLabel">動作一：雙手自然垂放</div>
          <div class="svg-stage" id="svgStage"></div>
        </div>

        <div class="instruction-text" id="instructionText">
          跟著節拍慢慢吸氣，雙手向上舉高，肩膀放輕鬆。
        </div>

        <div class="action-row">
          <button class="btn-large btn-primary" onclick="repeatVoice()">🔊 再聽一次指導</button>
          <button class="btn-large btn-danger" onclick="stopWorkout()">⏹ 結束運動</button>
        </div>
      </div>

      <!-- 步驟 C：運動完成與 Canvas 成就徽章生成 -->
      <div id="viewComplete" class="card hidden">
        <h2 style="text-align: center; color: var(--success); font-size: 1.9rem;">🎉 恭喜完成今日運動！</h2>
        <p style="text-align: center; color: var(--text-sub);">系統已自動為您記錄簽到天數，並製作專屬成就徽章：</p>

        <div class="canvas-wrapper">
          <canvas id="badgeCanvas" width="600" height="400"></canvas>
        </div>

        <div class="name-input-group">
          <label for="userNameInput">發布顯示名稱（選填，不填則直接顯示「長青運動員」）：</label>
          <input type="text" id="userNameInput" placeholder="例如：王阿公、陳阿嬤" maxlength="15" />
        </div>

        <div class="action-row">
          <button class="btn-large btn-success" id="btnPublish" onclick="publishToWall()">📢 一鍵發布到雲端動態牆</button>
          <button class="btn-large btn-primary" onclick="downloadBadge()">💾 儲存徽章圖片</button>
        </div>
        <div style="margin-top: 12px;">
          <button class="btn-large btn-outline" style="width: 100%;" onclick="resetToHome()">返回運動首頁</button>
        </div>
      </div>

    </section>

    <!-- =========================================
         分頁二：雲端同步零打字社群動態牆
         ========================================= -->
    <section id="sectionSocial" class="section">
      <div class="card" style="background-color: #EFF6FF; border-color: var(--primary);">
        <h2>鄰里與親友健康佈告欄</h2>
        <p>不用打字！點擊下方的大按鈕，就能即時幫所有連線的長輩與鄰居加油打氣。</p>
        <div class="cloud-status" id="cloudStatus">☁️ 正在連線至雲端動態牆...</div>
      </div>

      <div id="feedContainer"></div>
    </section>
  </main>

  <script type="module">
    /* =========================================
       2. Firebase 雲端資料庫初始化 (Firestore)
       ========================================= */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getFirestore,
      collection,
      addDoc,
      updateDoc,
      doc,
      increment,
      query,
      orderBy,
      limit,
      onSnapshot,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB9CiaiOOq1Gj3wLQTmEnMTX37UVJAkhbg",
      authDomain: "the-elderly-exercise-web.firebaseapp.com",
      projectId: "the-elderly-exercise-web",
      storageBucket: "the-elderly-exercise-web.firebasestorage.app",
      messagingSenderId: "168007642323",
      appId: "1:168007642323:web:21a2ba1ded75f76bacb826",
      measurementId: "G-CWY4VZPWH8"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const postsCollection = collection(db, "posts");

    /* =========================================
       3. 運動資料庫與向量示意圖
       ========================================= */
    const POSE_SVGS = {
      armsDown: `
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <circle cx="100" cy="42" r="22" fill="#1D4ED8"/>
          <line x1="100" y1="64" x2="100" y2="135" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>
          <line x1="100" y1="80" x2="65" y2="130" stroke="#1D4ED8" stroke-width="12" stroke-linecap="round"/>
          <line x1="100" y1="80" x2="135" y2="130" stroke="#1D4ED8" stroke-width="12" stroke-linecap="round"/>
          <line x1="100" y1="135" x2="78" y2="185" stroke="#0F172A" stroke-width="13" stroke-linecap="round"/>
          <line x1="100" y1="135" x2="122" y2="185" stroke="#0F172A" stroke-width="13" stroke-linecap="round"/>
        </svg>`,
      armsUp: `
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <circle cx="100" cy="42" r="22" fill="#15803D"/>
          <line x1="100" y1="64" x2="100" y2="135" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>
          <line x1="100" y1="80" x2="55" y2="30" stroke="#15803D" stroke-width="12" stroke-linecap="round"/>
          <line x1="100" y1="80" x2="145" y2="30" stroke="#15803D" stroke-width="12" stroke-linecap="round"/>
          <line x1="100" y1="135" x2="78" y2="185" stroke="#0F172A" stroke-width="13" stroke-linecap="round"/>
          <line x1="100" y1="135" x2="122" y2="185" stroke="#0F172A" stroke-width="13" stroke-linecap="round"/>
        </svg>`,
      armsWide: `
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <circle cx="100" cy="42" r="22" fill="#B45309"/>
          <line x1="100" y1="64" x2="100" y2="135" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>
          <line x1="100" y1="82" x2="35" y2="82" stroke="#B45309" stroke-width="12" stroke-linecap="round"/>
          <line x1="100" y1="82" x2="165" y2="82" stroke="#B45309" stroke-width="12" stroke-linecap="round"/>
          <line x1="100" y1="135" x2="78" y2="185" stroke="#0F172A" stroke-width="13" stroke-linecap="round"/>
          <line x1="100" y1="135" x2="122" y2="185" stroke="#0F172A" stroke-width="13" stroke-linecap="round"/>
        </svg>`,
      kneeLift: `
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <circle cx="100" cy="42" r="22" fill="#1D4ED8"/>
          <line x1="100" y1="64" x2="100" y2="130" stroke="#0F172A" stroke-width="14" stroke-linecap="round"/>
          <line x1="100" y1="82" x2="55" y2="105" stroke="#1D4ED8" stroke-width="12" stroke-linecap="round"/>
          <line x1="100" y1="82" x2="145" y2="105" stroke="#1D4ED8" stroke-width="12" stroke-linecap="round"/>
          <line x1="100" y1="130" x2="80" y2="185" stroke="#0F172A" stroke-width="13" stroke-linecap="round"/>
          <polyline points="100,130 142,130 142,175" fill="none" stroke="#15803D" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>`
    };

    const ROUTINES = {
      easy: {
        name: "簡單模式（5分鐘坐姿伸展）",
        steps: [
          {
            title: "第一組：雙手向上深呼吸",
            duration: 100,
            instruction: "坐在椅子上，吸氣時雙手慢慢舉高，吐氣時放下。",
            frames: [
              { label: "預備：雙手自然放下", svg: POSE_SVGS.armsDown },
              { label: "伸展：雙手向上舉高", svg: POSE_SVGS.armsUp }
            ]
          },
          {
            title: "第二組：擴胸舒展運動",
            duration: 100,
            instruction: "雙手向左右兩側打開，感覺胸口慢慢展開。",
            frames: [
              { label: "預備：雙手收回身側", svg: POSE_SVGS.armsDown },
              { label: "擴胸：雙臂水平張開", svg: POSE_SVGS.armsWide }
            ]
          },
          {
            title: "第三組：坐姿輪流抬膝",
            duration: 100,
            instruction: "雙手扶穩椅面，左右腳輪流輕輕抬起。",
            frames: [
              { label: "預備：雙腳平放地面", svg: POSE_SVGS.armsDown },
              { label: "抬腿：膝蓋向上抬起", svg: POSE_SVGS.kneeLift }
            ]
          }
        ]
      },
      medium: {
        name: "中等模式（10分鐘站立平衡）",
        steps: [
          {
            title: "第一組：站姿雙臂畫圓",
            duration: 200,
            instruction: "雙腳與肩同寬站穩，雙手向上伸展活動肩關節。",
            frames: [
              { label: "預備：站姿雙手垂放", svg: POSE_SVGS.armsDown },
              { label: "伸展：雙手向上延伸", svg: POSE_SVGS.armsUp }
            ]
          },
          {
            title: "第二組：平舉擴胸平衡",
            duration: 200,
            instruction: "雙臂向兩側平舉，保持呼吸順暢與身體穩定。",
            frames: [
              { label: "預備：放鬆肩頸", svg: POSE_SVGS.armsDown },
              { label: "平舉：雙手向兩側展開", svg: POSE_SVGS.armsWide }
            ]
          },
          {
            title: "第三組：原地高抬腿踏步",
            duration: 200,
            instruction: "跟著節拍原地踏步，可隨時扶著椅背保持安全。",
            frames: [
              { label: "左腳著地預備", svg: POSE_SVGS.armsDown },
              { label: "右膝抬高踏步", svg: POSE_SVGS.kneeLift }
            ]
          }
        ]
      },
      demo: {
        name: "展示體驗模式（完整流程示範）",
        steps: [
          {
            title: "暖身：雙手向上伸展",
            duration: 5,
            instruction: "吸氣時雙手慢慢舉高，肩膀放輕鬆。",
            frames: [
              { label: "動作一：雙手自然垂放", svg: POSE_SVGS.armsDown },
              { label: "動作二：雙手向上舉高", svg: POSE_SVGS.armsUp }
            ]
          },
          {
            title: "核心：平舉擴胸運動",
            duration: 5,
            instruction: "雙手向左右打開，保持深呼吸。",
            frames: [
              { label: "動作一：雙手收回", svg: POSE_SVGS.armsDown },
              { label: "動作二：雙臂水平張開", svg: POSE_SVGS.armsWide }
            ]
          },
          {
            title: "下肢：原地踏步抬膝",
            duration: 5,
            instruction: "阿公阿嬤很棒喔，最後五秒鐘，跟著節拍踏步！",
            frames: [
              { label: "動作一：雙腳站穩", svg: POSE_SVGS.armsDown },
              { label: "動作二：膝蓋抬起", svg: POSE_SVGS.kneeLift }
            ]
          }
        ]
      }
    };

    /* =========================================
       4. 狀態變數與本機紀錄
       ========================================= */
    let currentRoutine = null;
    let currentStepIdx = 0;
    let remainingSec = 0;
    let totalRoutineSec = 0;
    let elapsedRoutineSec = 0;
    let frameIndex = 0;
    let timerInterval = null;
    let carouselInterval = null;
    let audioEnabled = true;
    let latestBadgeDataUrl = "";
    let badgePublished = false;

    let streakDays = parseInt(localStorage.getItem("usr_streak_days") || "1", 10);
    let userReactedMap = JSON.parse(localStorage.getItem("usr_reacted_map") || "{}");

    const savedName = localStorage.getItem("usr_display_name") || "";
    document.getElementById("userNameInput").value = savedName;

    function updateStreakBanner() {
      document.getElementById("headerStreak").textContent = `🔥 目前連續運動：${streakDays} 天`;
    }
    updateStreakBanner();

    /* =========================================
       5. Web Speech API 語音合成 & 節拍音效
       ========================================= */
    function speakText(text) {
      if (!audioEnabled || !("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = "zh-TW";
      utterance.rate = 0.92;
      utterance.pitch = 1.05;
      window.speechSynthesis.speak(utterance);
    }

    function playSoftBeep() {
      if (!audioEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(520, ctx.currentTime);
        gain.gain.setValueAtTime(0.04, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.12);
      } catch (e) {}
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      document.getElementById("audioStatusText").textContent = audioEnabled ? "🔊 語音開啟中" : "🔇 語音已靜音";
      if (!audioEnabled && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
      }
    }

    function repeatVoice() {
      if (!currentRoutine) return;
      const step = currentRoutine.steps[currentStepIdx];
      speakText(`${step.title}。${step.instruction}`);
    }

    /* =========================================
       6. 運動計時狀態機與動態圖片輪播
       ========================================= */
    function startWorkout(modeKey) {
      currentRoutine = ROUTINES[modeKey];
      currentStepIdx = 0;
      elapsedRoutineSec = 0;
      totalRoutineSec = currentRoutine.steps.reduce((sum, s) => sum + s.duration, 0);
      badgePublished = false;

      const btnPublish = document.getElementById("btnPublish");
      btnPublish.disabled = false;
      btnPublish.textContent = "📢 一鍵發布到雲端動態牆";

      document.getElementById("viewSelect").classList.add("hidden");
      document.getElementById("viewComplete").classList.add("hidden");
      document.getElementById("viewActive").classList.remove("hidden");

      loadStep(0);

      timerInterval = setInterval(() => {
        remainingSec--;
        elapsedRoutineSec++;
        updateTimerUI();
        playSoftBeep();

        if (remainingSec === 10) {
          speakText("阿公阿嬤很棒喔，剩下十秒鐘，加油！");
        }

        if (remainingSec <= 0) {
          if (currentStepIdx + 1 < currentRoutine.steps.length) {
            loadStep(currentStepIdx + 1);
          } else {
            finishWorkout();
          }
        }
      }, 1000);
    }

    function loadStep(idx) {
      currentStepIdx = idx;
      const step = currentRoutine.steps[idx];
      remainingSec = step.duration;
      frameIndex = 0;

      document.getElementById("stepCounter").textContent = `動作 ${idx + 1} / ${currentRoutine.steps.length}`;
      document.getElementById("exerciseTitle").textContent = step.title;
      document.getElementById("instructionText").textContent = step.instruction;

      updateTimerUI();
      renderCarouselFrame();
      speakText(`${step.title}。${step.instruction}`);

      clearInterval(carouselInterval);
      carouselInterval = setInterval(() => {
        frameIndex = (frameIndex + 1) % step.frames.length;
        renderCarouselFrame();
      }, 1500);
    }

    function renderCarouselFrame() {
      const step = currentRoutine.steps[currentStepIdx];
      const frame = step.frames[frameIndex];
      document.getElementById("poseFrameLabel").textContent = frame.label;
      document.getElementById("svgStage").innerHTML = frame.svg;
    }

    function updateTimerUI() {
      const mins = String(Math.floor(remainingSec / 60)).padStart(2, "0");
      const secs = String(remainingSec % 60).padStart(2, "0");
      document.getElementById("timerText").textContent = `${mins}:${secs}`;

      const pct = Math.min(100, Math.round((elapsedRoutineSec / totalRoutineSec) * 100));
      document.getElementById("progressBar").style.width = `${pct}%`;
    }

    function stopWorkout() {
      clearInterval(timerInterval);
      clearInterval(carouselInterval);
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      resetToHome();
    }

    function finishWorkout() {
      clearInterval(timerInterval);
      clearInterval(carouselInterval);

      streakDays += 1;
      localStorage.setItem("usr_streak_days", String(streakDays));
      updateStreakBanner();

      document.getElementById("viewActive").classList.add("hidden");
      document.getElementById("viewComplete").classList.remove("hidden");

      speakText(`太棒了！恭喜完成今天的運動，您已經連續運動 ${streakDays} 天了！`);
      drawAchievementBadge();
    }

    /* =========================================
       7. HTML5 Canvas 繪製極簡數位成就徽章
       ========================================= */
    function drawAchievementBadge() {
      const canvas = document.getElementById("badgeCanvas");
      const ctx = canvas.getContext("2d");

      ctx.fillStyle = "#F8FAFC";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = "#0F172A";
      ctx.lineWidth = 8;
      ctx.strokeRect(16, 16, canvas.width - 32, canvas.height - 32);

      ctx.fillStyle = "#1D4ED8";
      ctx.fillRect(16, 16, canvas.width - 32, 64);
      ctx.fillStyle = "#FFFFFF";
      ctx.font = "bold 26px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("數位社會處方｜健康運動成就卡", canvas.width / 2, 57);

      ctx.beginPath();
      ctx.arc(canvas.width / 2, 190, 78, 0, Math.PI * 2);
      ctx.fillStyle = "#FEF3C7";
      ctx.fill();
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#B45309";
      ctx.stroke();

      ctx.fillStyle = "#78350F";
      ctx.font = "900 64px sans-serif";
      ctx.fillText(`${streakDays} 天`, canvas.width / 2, 212);

      ctx.fillStyle = "#0F172A";
      ctx.font = "bold 30px sans-serif";
      ctx.fillText(`連續運動 ${streakDays} 天達成！`, canvas.width / 2, 315);

      const todayStr = new Date().toLocaleDateString("zh-TW");
      ctx.fillStyle = "#334155";
      ctx.font = "bold 20px sans-serif";
      ctx.fillText(`${currentRoutine.name} ｜ ${todayStr}`, canvas.width / 2, 355);

      // 輸出壓縮 JPEG，確保檔案輕量且快速寫入 Firestore
      latestBadgeDataUrl = canvas.toDataURL("image/jpeg", 0.85);
    }

    function downloadBadge() {
      if (!latestBadgeDataUrl) return;
      const link = document.createElement("a");
      link.download = `健康成就徽章_連續${streakDays}天.jpg`;
      link.href = latestBadgeDataUrl;
      link.click();
    }

    /* =========================================
       8. Firestore 雲端動態牆讀寫與即時監聽
       ========================================= */
    async function publishToWall() {
      if (badgePublished) {
        switchTab("social");
        return;
      }

      const btnPublish = document.getElementById("btnPublish");
      btnPublish.disabled = true;
      btnPublish.textContent = "⏳ 正在上傳至雲端動態牆...";

      const rawName = document.getElementById("userNameInput").value.trim();
      const authorName = rawName || "長青運動員";
      if (rawName) {
        localStorage.setItem("usr_display_name", rawName);
      }

      try {
        await addDoc(postsCollection, {
          author: authorName,
          summary: `完成「${currentRoutine.name}」，達成連續運動 ${streakDays} 天！`,
          badgeImg: latestBadgeDataUrl,
          reactions: { like: 0, clap: 0, heart: 0 },
          createdAt: serverTimestamp()
        });

        badgePublished = true;
        btnPublish.textContent = "✅ 已發布至雲端動態牆";
        switchTab("social");
      } catch (err) {
        console.error("發布失敗：", err);
        alert("發布至雲端失敗，請確認 Firebase Firestore 資料庫已建立並開啟測試模式。");
        btnPublish.disabled = false;
        btnPublish.textContent = "📢 一鍵發布到雲端動態牆";
      }
    }

    function formatTimestamp(ts) {
      if (!ts) return "剛剛";
      const date = ts.toDate();
      const month = date.getMonth() + 1;
      const day = date.getDate();
      const hours = String(date.getHours()).padStart(2, "0");
      const mins = String(date.getMinutes()).padStart(2, "0");
      return `${month}/${day} ${hours}:${mins}`;
    }

    // 即時監聽雲端 Firestore 資料變化（所有連線裝置同步更新）
    const postsQuery = query(postsCollection, orderBy("createdAt", "desc"), limit(30));
    onSnapshot(
      postsQuery,
      (snapshot) => {
        const statusEl = document.getElementById("cloudStatus");
        statusEl.className = "cloud-status";
        statusEl.textContent = `☁️ 雲端即時連線中（目前共有 ${snapshot.size} 則健康動態）`;

        const container = document.getElementById("feedContainer");
        container.innerHTML = "";

        if (snapshot.empty) {
          container.innerHTML = `
            <div class="card empty-wall">
              目前雲端佈告欄還沒有動態喔！<br/>快去完成一次運動，搶先發布第一張成就卡吧！
            </div>`;
          return;
        }

        snapshot.forEach((docSnap) => {
          const post = docSnap.data();
          const postId = docSnap.id;
          const reactions = post.reactions || { like: 0, clap: 0, heart: 0 };
          const myReactions = userReactedMap[postId] || {};

          const card = document.createElement("div");
          card.className = "post-card";

          const badgeHtml = post.badgeImg
            ? `<img class="post-badge-img" src="${post.badgeImg}" alt="數位成就徽章" />`
            : "";

          card.innerHTML = `
            <div class="post-header">
              <span class="post-author">${escapeHtml(post.author || "長青運動員")}</span>
              <span class="post-time">${formatTimestamp(post.createdAt)}</span>
            </div>
            <p style="font-weight:700; margin-bottom:8px;">${escapeHtml(post.summary || "")}</p>
            ${badgeHtml}
            <div class="reaction-bar">
              <button class="react-btn ${myReactions.like ? "reacted" : ""}" onclick="toggleReaction('${postId}', 'like')">
                👍 真讚 (${reactions.like || 0})
              </button>
              <button class="react-btn ${myReactions.clap ? "reacted" : ""}" onclick="toggleReaction('${postId}', 'clap')">
                👏 好棒 (${reactions.clap || 0})
              </button>
              <button class="react-btn ${myReactions.heart ? "reacted" : ""}" onclick="toggleReaction('${postId}', 'heart')">
                ❤️ 加油 (${reactions.heart || 0})
              </button>
            </div>
          `;
          container.appendChild(card);
        });
      },
      (error) => {
        console.error("Firestore 監聽錯誤：", error);
        const statusEl = document.getElementById("cloudStatus");
        statusEl.className = "cloud-status error";
        statusEl.textContent = "⚠️ 雲端連線異常，請確認 Firestore 已啟用並設為測試模式";
      }
    );

    async function toggleReaction(postId, type) {
      if (!userReactedMap[postId]) {
        userReactedMap[postId] = {};
      }
      const alreadyReacted = !!userReactedMap[postId][type];
      const delta = alreadyReacted ? -1 : 1;

      userReactedMap[postId][type] = !alreadyReacted;
      localStorage.setItem("usr_reacted_map", JSON.stringify(userReactedMap));
      if (!alreadyReacted) playSoftBeep();

      try {
        const postRef = doc(db, "posts", postId);
        await updateDoc(postRef, {
          [`reactions.${type}`]: increment(delta)
        });
      } catch (err) {
        console.error("更新貼圖失敗：", err);
      }
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    /* =========================================
       9. 頁面切換控制與全域函式綁定
       ========================================= */
    function switchTab(tabName) {
      document.getElementById("tabExercise").classList.toggle("active", tabName === "exercise");
      document.getElementById("tabSocial").classList.toggle("active", tabName === "social");
      document.getElementById("sectionExercise").classList.toggle("active", tabName === "exercise");
      document.getElementById("sectionSocial").classList.toggle("active", tabName === "social");
    }

    function resetToHome() {
      document.getElementById("viewSelect").classList.remove("hidden");
      document.getElementById("viewActive").classList.add("hidden");
      document.getElementById("viewComplete").classList.add("hidden");
      document.getElementById("progressBar").style.width = "0%";
    }

    // 將模組內函式掛載至 window 供 HTML 按鈕呼叫
    window.switchTab = switchTab;
    window.startWorkout = startWorkout;
    window.toggleAudio = toggleAudio;
    window.repeatVoice = repeatVoice;
    window.stopWorkout = stopWorkout;
    window.publishToWall = publishToWall;
    window.downloadBadge = downloadBadge;
    window.resetToHome = resetToHome;
    window.toggleReaction = toggleReaction;
  </script>
</body>
</html>
